<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111"> 
  
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Luma Studio</title>

<style>
* {
  box-sizing: border-box;
}

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => {
        console.log("Luma Studio offline ready");
      })
      .catch(error => {
        console.error("Service Worker error:", error);
      });
  });
}
</script>
        
body {
  margin: 0;
  background: #111;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  border-bottom: 1px solid #333;
  font-size: 22px;
  font-weight: bold;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

button, .upload {
  background: #292929;
  color: white;
  border: 1px solid #444;
  padding: 12px 16px;
  border-radius: 10px;
  cursor: pointer;
}

.upload {
  display: inline-block;
  margin-bottom: 16px;
}

input[type="file"] {
  display: none;
}

.preview {
  background: #1c1c1c;
  border-radius: 12px;
  min-height: 250px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

canvas {
  max-width: 100%;
  max-height: 65vh;
  display: block;
}

#placeholder {
  color: #888;
  padding: 20px;
  text-align: center;
}

.controls {
  margin-top: 20px;
  background: #1c1c1c;
  padding: 18px;
  border-radius: 12px;
}

.control {
  margin-bottom: 18px;
}

.control label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 14px;
}

input[type="range"] {
  width: 100%;
  accent-color: #d8d8d8;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
</style>
</head>

<body>

<header>✦ Luma Studio</header>

<main>
  <label class="upload">
    + Import Foto
    <input type="file" id="file"
      accept="image/jpeg,image/png,image/webp">
  </label>

  <div class="preview">
    <p id="placeholder">
      Pilih foto untuk mulai mengedit
    </p>
    <canvas id="canvas" hidden></canvas>
  </div>

  <section class="controls">
    <h3>Light & Color</h3>

    <div class="control">
      <label>Brightness <span id="v1">100%</span></label>
      <input type="range" id="brightness"
        min="0" max="200" value="100">
    </div>

    <div class="control">
      <label>Contrast <span id="v2">100%</span></label>
      <input type="range" id="contrast"
        min="0" max="200" value="100">
    </div>

    <div class="control">
      <label>Saturation <span id="v3">100%</span></label>
      <input type="range" id="saturation"
        min="0" max="200" value="100">
    </div>

    <div class="actions">
      <button id="reset">Reset</button>
      <button id="download">Export JPG</button>
    </div>
  </section>
</main>

<script>
const file = document.getElementById("file");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const placeholder = document.getElementById("placeholder");

let photo = new Image();

const sliders = [
  document.getElementById("brightness"),
  document.getElementById("contrast"),
  document.getElementById("saturation")
];

file.addEventListener("change", event => {
  const selected = event.target.files[0];
  if (!selected) return;

  const url = URL.createObjectURL(selected);

  photo.onload = () => {
    canvas.width = photo.naturalWidth;
    canvas.height = photo.naturalHeight;

    canvas.hidden = false;
    placeholder.hidden = true;

    render();
    URL.revokeObjectURL(url);
  };

  photo.src = url;
});

function render() {
  if (!photo.src) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.filter =
    `brightness(${sliders[0].value}%) ` +
    `contrast(${sliders[1].value}%) ` +
    `saturate(${sliders[2].value}%)`;

  ctx.drawImage(photo, 0, 0);
  ctx.filter = "none";

  sliders.forEach((slider, index) => {
    document.getElementById(`v${index + 1}`)
      .textContent = slider.value + "%";
  });
}

sliders.forEach(slider => {
  slider.addEventListener("input", render);
});

document.getElementById("reset").onclick = () => {
  sliders.forEach(slider => slider.value = 100);
  render();
};

document.getElementById("download").onclick = () => {
  if (!photo.src) {
    alert("Import foto terlebih dahulu");
    return;
  }

  canvas.toBlob(blob => {
    if (!blob) return;

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "luma-studio.jpg";
    link.click();

    URL.revokeObjectURL(link.href);
  }, "image/jpeg", 0.95);
};
</script>

</body>
  </html>
